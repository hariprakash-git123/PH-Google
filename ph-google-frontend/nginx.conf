# PH Google frontend — static file serving for the Vite build, and the
# same-origin entry point to the API.
#
# Installed at /etc/nginx/conf.d/default.conf inside the image. Port 8080
# because nginx-unprivileged runs as a non-root user, which cannot bind 80.
#
# The browser only ever talks to this server: pages and assets from the
# build, and /api/* proxied to the backend service on the compose network.
# So the bundle calls the relative "/api" (VITE_API_BASE_URL), there is no
# CORS round trip, and the backend need not be published to the host.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version to every visitor.
    server_tokens off;

    # Docker's embedded DNS. The backend's address is looked up per request
    # (through the variable below) rather than once at startup, so recreating
    # the backend container — which gives it a new IP — does not leave nginx
    # proxying to the old one.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_backend http://backend:5000;

    # Behind a load balancer / TLS proxy: trust its X-Forwarded-For, and only
    # from its own addresses. Replace the range with the balancer's.
    # set_real_ip_from  10.0.0.0/8;
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;

    # --- API -------------------------------------------------------------
    # Every path under /api goes to the backend unchanged (proxy_pass with a
    # variable and no URI part passes the request URI as it came). The API
    # has no WebSocket or streaming endpoints; plain HTTP/1.1 is enough.
    location /api/ {
        proxy_pass         $api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_set_header   Host              $host;
        # The client's address, as nginx saw it. Set, not appended: a value
        # the client sent in its own X-Forwarded-For is discarded, so the
        # backend's rate limits (TRUST_PROXY=1: this server) cannot be
        # sidestepped by forging the header. If a load balancer is put in
        # front of this server, uncomment the real_ip lines below with its
        # address range so $remote_addr is the visitor again (DEPLOYMENT.md,
        # "Client IPs behind a load balancer"); TRUST_PROXY stays 1.
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The slowest requests are a first Images search and an AI answer,
        # which wait on outside services (up to ~30 s); leave headroom.
        proxy_connect_timeout 5s;
        proxy_read_timeout    90s;
        proxy_send_timeout    30s;

        # No endpoint accepts a large body (the API caps JSON at 100 kB).
        client_max_body_size 1m;

        # The API sets these itself (helmet); nginx adds its own below, so
        # the API's copies are dropped rather than sent twice.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;

        add_header X-Content-Type-Options nosniff       always;
        add_header X-Frame-Options        SAMEORIGIN    always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
    }

    # --- The app ---------------------------------------------------------
    # React Router owns the URL space. Without this, loading /search?q=x
    # directly — or refreshing it — asks nginx for a file that was never
    # built and returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite writes content hashes into asset filenames, so a given URL's
    # contents can never change. Cache them for a year.
    #
    # A location with its own add_header does not inherit the server's, so
    # the security headers are repeated in each one that sets a header.
    location /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff       always;
        add_header X-Frame-Options        SAMEORIGIN    always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
    }

    # index.html is the one file whose contents change on every deploy while
    # keeping its name. Caching it would serve the old asset references and
    # make a deploy invisible until the copy expired.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff       always;
        add_header X-Frame-Options        SAMEORIGIN    always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
    }

    # Compression. Vite already minifies; gzip roughly thirds what is left.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      application/javascript
                      application/json
                      image/svg+xml;

    # Static-hosting hardening. X-Frame-Options stays SAMEORIGIN: the app
    # frames itself for its own PH tabs (BrowserShell), so DENY would break
    # them.
    add_header X-Content-Type-Options nosniff       always;
    add_header X-Frame-Options        SAMEORIGIN    always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;
}
